<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080c19">
  <title>星際防衛戰</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body>
  <main class="console">
    <header class="hud">
      <div class="brand">✦ <span>星際防衛戰</span></div>
      <div class="stats">
        <div>分數 <strong id="score">00000</strong></div>
        <div>生命 <strong id="lives">3</strong></div>
        <div>關卡 <strong id="level">01</strong></div>
      </div>
    </header>
    <section class="arena" aria-label="遊戲區">
      <canvas id="field" aria-label="太空戰場">此瀏覽器需要支援 Canvas。</canvas>
      <div class="overlay" id="overlay">
        <div class="intro">
          <div class="mark" aria-hidden="true">✦</div>
          <p class="eyebrow" id="subtitle">STAR DEFENSE</p>
          <h1 id="title">星際防衛戰</h1>
          <p class="description" id="description">駕駛戰機，守住星際防線。</p>
          <button id="start" type="button">開始遊戲 <span aria-hidden="true">→</span></button>
          <p class="hint">觸控按鈕，或使用方向鍵與空白鍵</p>
        </div>
      </div>
      <div id="announcement" class="announcement" role="status"></div>
    </section>
    <footer class="controls" aria-label="遊戲控制">
      <div class="direction">
        <button type="button" data-control="left" aria-label="向左移動">←</button>
        <button type="button" data-control="right" aria-label="向右移動">→</button>
      </div>
      <button class="fire" type="button" data-control="fire"><span aria-hidden="true">✦</span> 射擊</button>
    </footer>
  </main>
</body>
</html>
